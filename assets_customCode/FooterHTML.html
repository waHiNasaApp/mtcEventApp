<!-- BACK BUTTON -->

<!-- Add back button -->
<a
  id="back-button"
  href="javascript:history.back()"
  style="
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    color: #555;
    font-family: sans-serif;
    font-weight: 500;
    gap: 4px;
    font-size: 14px;

    /* Positioning logic */
    position: fixed;
    top: 30px;
    left: 20px;
    z-index: 1000;
    padding: 10px 10px;
    border-radius: 5px;
  "
>
  <svg
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <line x1="19" y1="12" x2="5" y2="12"></line>
    <polyline points="12 19 5 12 12 5"></polyline>
  </svg>

  <span>Back</span>
</a>

<!-- Hide it if we are at root or one layer deep with 4 numbers (i.e. an event main page) -->
<script>
  let path = window.location.pathname;
  if (/^\/(?:[^/]*\d{4}[^/]*\/?)?$/.test(path)) {
    document.getElementById('back-button').style.display = 'none';
  }
</script>

<!-- LOADING BAR (via NProgress) -->
<!-- Load NProgress CSS & JS -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.css"
/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.js"></script>

<!-- NProgress Colors -->
<style>
  #nprogress .bar {
    background: #003f87 !important;
  }
  #nprogress .peg {
    box-shadow: 0 0 10px #003f87, 0 0 5px #003f87 !important;
  }
  #nprogress .spinner-icon {
    border-top-color: #003f87 !important;
    border-left-color: #003f87 !important;
  }
</style>

<!-- NProgress Logic -->
<script>
  // Complete loading bar on initial page load
  NProgress.start();
  window.addEventListener('load', function () {
    NProgress.done();
  });

  // Intercept all URL clicks
  document.addEventListener('click', function (e) {
    let target = e.target.closest('a');

    if (target && target.href) {
      // Exclude new tabs, modifier key clicks, and protocol links
      if (
        target.target === '_blank' ||
        e.ctrlKey ||
        e.metaKey ||
        target.href.startsWith('mailto:') ||
        target.href.startsWith('tel:') ||
        target.href.startsWith('#')
      ) {
        return;
      }
      NProgress.start();
    }
  });

  // Intercept browser-level back/forward navigation
  window.addEventListener('popstate', function () {
    NProgress.start();
  });

  // Fallback to finish the progress bar if navigating away takes too long
  window.addEventListener('pagehide', function () {
    NProgress.done();
  });

  // Clear the loading bar when the user returns to this tab
  // This handles file previews, downloads, or external links that return focus
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      NProgress.done();
    }
  });

  window.addEventListener('focus', function () {
    NProgress.done();
  });
  
  // Extra fallback: when returning to the page via back/forward cache (bfcache)
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) {
      NProgress.done();
    }
  });
</script>
